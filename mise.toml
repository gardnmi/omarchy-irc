[tasks.restart]
description = "Deploy the local plugin and restart Omarchy shell"
run = "bash deploy-local.sh"

[tasks.test]
description = "Run IRC parser and IPC tests"
run = "python3 -m unittest discover -s tests -v"

[tasks.validate]
description = "Validate the complete plugin"
run = "omarchy plugin validate . && qmllint -I /usr/share/omarchy/shell Panel.qml && bash -n deploy-local.sh && python3 -m unittest discover -s tests -v && git diff --check"
